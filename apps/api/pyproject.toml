[tool.poetry]
name = "kamusi-api"
version = "0.1.0"
description = "Kamusi FastAPI backend"
authors = ["Kamusi Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.110.0"
uvicorn = { version = "^0.27.1", extras = ["standard"] }
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.29"
alembic = "^1.13.1"
psycopg = { version = "^3.1.18", extras = ["binary"] }
pydantic-settings = "^2.2.1"
wiktextract = "^1.99.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
alembic = "^1.17.2"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
