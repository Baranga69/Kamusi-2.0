name: kamusi_mobile
description: Kamusi Flutter mobile app scaffold.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations in the Flutter SDK; only DateFormat is used.
  intl: ^0.20.2
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  shared_preferences: ^2.2.3
  # Short synthesised cues when a word lands. The one thing haptics cannot
  # do is tell you *which* thing happened, and a game with no sound reads as
  # unfinished to anyone under about twenty-five.
  audioplayers: ^6.1.0
  flutter_confetti: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
